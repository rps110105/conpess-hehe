<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffb3c6" />
<title>Massage for shanaa💌</title>

<!-- Font 8-bit dari Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     1. RESET & BASE
     ============================================================ */
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  :root{
    --pink:       #ffb3c6;
    --pink-light: #ffe4ec;
    --pink-bg:    #fff0f5;
    --red:        #ff4d6d;
    --white:      #ffffff;
    --dark:       #3a3a3a;
    --purple:     #c9a0ff;
    --tear:       #9fe6ff;
    --yellow:     #fff6b7;
  }

  body{
    font-family:'Press Start 2P', monospace;
    background: linear-gradient(180deg, var(--pink-light) 0%, var(--pink-bg) 100%);
    color: var(--dark);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:16px;
    line-height:1.6;
    -webkit-tap-highlight-color: transparent;
  }

  /* ============================================================
     2. LAYOUT UTAMA & SCREEN (HALAMAN)
     ============================================================ */
  #app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
  }

  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    width:100%;
  }
  .screen.active{
    display:flex;
    animation: fadeIn .5s ease;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ============================================================
     3. CARD ALA KOTAK GAME 8-BIT
     ============================================================ */
  .card{
    position:relative;
    background: var(--white);
    border: 4px solid var(--dark);
    box-shadow: 0 0 0 4px var(--pink), 8px 8px 0 0 var(--red);
    padding: 24px 16px;
    width:100%;
  }

  .title{
    font-size: clamp(1.05rem, 5.5vw, 1.6rem);
    color: var(--red);
    text-shadow: 3px 3px 0 var(--pink-light), 5px 5px 0 var(--pink);
    margin: 4px 0 14px;
    line-height:1.6;
  }
  .q-title{
    font-size: clamp(0.8rem, 4.2vw, 1.05rem);
    margin: 4px 0 16px;
    line-height:1.7;
  }
  .subtitle{
    font-size:0.6rem;
    opacity:.65;
    margin: 12px 0 20px;
  }
  .msg{
    font-size: clamp(0.8rem, 4vw, 1rem);
    margin: 16px 0 8px;
    line-height:1.9;
  }
  .msg.big{
    font-size: clamp(1rem, 5vw, 1.3rem);
    color: var(--red);
    margin-top:6px;
  }
  .msg.small-text{
    font-size:0.6rem;
    opacity:.7;
    margin-top:14px;
  }

  /* ============================================================
     4. TOMBOL PIKSEL
     ============================================================ */
  .btn{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(0.65rem, 3.4vw, 0.85rem);
    padding: 14px 18px;
    border: 4px solid var(--dark);
    background: var(--pink);
    color: var(--dark);
    cursor:pointer;
    box-shadow: 4px 4px 0 0 var(--dark);
    transition: transform .06s ease, box-shadow .06s ease;
    text-transform:uppercase;
    -webkit-user-select:none;
    user-select:none;
  }
  .btn:active{
    transform: translate(4px,4px);
    box-shadow: 0 0 0 0 var(--dark);
  }
  .btn-primary{
    background: var(--red);
    color:#fff;
    margin-top:6px;
    width:100%;
  }
  .choice-buttons{
    display:flex;
    gap:12px;
    margin-top:22px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
  }
  .choice-buttons .btn{
    flex:1 1 100px;
    font-size: clamp(0.45rem, 2.6vw, 0.65rem);
  }
  .btn-yes{ background: var(--red); color:#fff; }
  .btn-no{ background: var(--white); color: var(--dark); }

  .btn-ghost{
    background:transparent;
    border:2px dashed #d8d8d8;
    color:#b9b9b9;
    box-shadow:none;
    font-size:0.6rem;
    padding:10px 16px;
    margin-top:26px;
  }
  .btn-ghost:active{ transform:none; box-shadow:none; }

  .hidden{ display:none !important; }

  /* ============================================================
     5. TOMBOL SUARA
     ============================================================ */
  .sound-toggle{
    position:absolute;
    top:10px; right:10px;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background: var(--pink-light);
    border: 3px solid var(--dark);
    font-size:1rem;
    cursor:pointer;
    box-shadow: 3px 3px 0 0 var(--dark);
  }
  .sound-toggle:active{ transform: translate(3px,3px); box-shadow:none; }

  /* ============================================================
     6. STAGE PIXEL ART (KARAKTER)
     ============================================================ */
  .pixel-stage{
    position:relative;
    width:84px; height:84px;
    margin: 4px auto 16px;
  }
  .pixel-stage.party{
    width:70px; height:70px;
    margin:0;
  }
  .pixel-art{
    position:absolute;
    top:0; left:0;
    width:6px; height:6px;
    image-rendering: pixelated;
  }

  /* idle bounce (landing page) */
  @keyframes idleBounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }
  .pixel-art.idle{ animation: idleBounce 1.4s ease-in-out infinite; }

  /* dancing (happy ending) */
  @keyframes dance{
    0%   { transform: translate(0,0) rotate(0deg); }
    25%  { transform: translate(-3px,-9px) rotate(-8deg); }
    50%  { transform: translate(0,-2px) rotate(0deg); }
    75%  { transform: translate(3px,-9px) rotate(8deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  .pixel-art.dancing{ animation: dance .6s ease-in-out infinite; }
  .pixel-art.delay1{ animation-delay:.15s; }
  .pixel-art.delay2{ animation-delay:.3s; }

  /* crying / sob shake (sad ending) */
  @keyframes sob{
    0%,100%{ transform: translate(0,0) rotate(0deg); }
    25%{ transform: translate(-2px,1px) rotate(-2deg); }
    75%{ transform: translate(2px,1px) rotate(2deg); }
  }
  .pixel-art.crying{ animation: sob .35s ease-in-out infinite; }

  /* ============================================================
     7. PARTY ROW (ENDING)
     ============================================================ */
  .party-row{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:8px;
    margin: 6px auto 12px;
  }

  /* ============================================================
     8. TETESAN AIR MATA (TEARS)
     ============================================================ */
  .tears{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .tears.big-tears{
    position:relative;
    width:100%;
    height:26px;
    margin-top:-4px;
  }
  .tear-pixel{
    position:absolute;
    top:40px;
    width:5px; height:5px;
    background: var(--tear);
    border:1px solid #6fc8e6;
    animation: tearFall 1.1s linear infinite;
  }
  .big-tears .tear-pixel{ top:0; }
  @keyframes tearFall{
    0%{ transform: translateY(0); opacity:1; }
    100%{ transform: translateY(46px); opacity:0; }
  }

  /* ============================================================
     9. SLIDER MOOD
     ============================================================ */
  .slider-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 14px 0 6px;
    width:100%;
    justify-content:center;
  }
  .pixel-slider{
    -webkit-appearance:none;
    appearance:none;
    width:65%;
    height:12px;
    background: var(--pink-light);
    border: 3px solid var(--dark);
    outline:none;
  }
  .pixel-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:22px; height:22px;
    background: var(--red);
    border:3px solid var(--dark);
    border-radius:0;
    cursor:pointer;
  }
  .pixel-slider::-moz-range-thumb{
    width:22px; height:22px;
    background: var(--red);
    border:3px solid var(--dark);
    border-radius:0;
    cursor:pointer;
  }
  .mood-value{
    font-size:1.2rem;
    color: var(--red);
    min-width:1.6em;
    text-align:center;
    background: var(--pink-light);
    border:3px solid var(--dark);
    padding:6px 4px;
  }
  .mood-labels{
    display:flex;
    justify-content:space-between;
    width:65%;
    margin: 4px auto 18px;
    font-size:0.55rem;
    opacity:.7;
  }

  /* ============================================================
     10. EFEK TYPING (PERTANYAAN 2)
     ============================================================ */
  .typing{
    font-size: clamp(0.65rem, 3.4vw, 0.8rem);
    line-height:2;
    min-height:160px;
    text-align:left;
    margin: 8px 0 0;
    word-break: break-word;
  }
  .typing::after{
    content:"▌";
    color: var(--red);
    animation: blink .8s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ============================================================
     11. KONFETI (PESTA PIKSEL)
     ============================================================ */
  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:50;
  }
  .confetti-piece{
    position:absolute;
    top:-12px;
    width:8px; height:8px;
    opacity:.95;
    animation: confettiFall linear infinite;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(-12px) rotate(0deg); }
    100%{ transform: translateY(110vh) rotate(360deg); }
  }

  /* ============================================================
     12. DEKORASI HATI MELAYANG (BACKGROUND)
     ============================================================ */
  .bg-decor{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .bg-heart{
    position:absolute;
    bottom:-40px;
    width:28px; height:24px;
    opacity:.4;
    animation: floatUp linear infinite;
  }
  .bg-heart .pixel-art{ position:absolute; top:0; left:0; }
  @keyframes floatUp{
    0%{ transform: translateY(0) rotate(0deg); opacity:.4; }
    85%{ opacity:.35; }
    100%{ transform: translateY(-115vh) rotate(25deg); opacity:0; }
  }

  /* ============================================================
     13. RESPONSIVE (LAYAR LEBIH BESAR)
     ============================================================ */
  @media (min-width:480px){
    .card{ padding:32px 28px; }
    .pixel-stage{ transform: scale(1.3); margin: 10px auto 26px; }
    .party-row{ gap:22px; margin: 14px auto 18px; }
    .party-row .pixel-stage.party{ transform: scale(1.25); }
  }

  /* hormati preferensi reduced motion */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }
</style>
</head>
<body>

  <!-- Dekorasi hati piksel melayang di background -->
  <div class="bg-decor" id="bgDecor"></div>

  <div id="app">

    <!-- ============================================================

        </div>

        <button class="btn btn-primary" id="btnStart">START ▶</button>

    <!-- ============================================================

    <!-- ============================================================
         HALAMAN 4A: HASIL "IYA" -> PESTA
         ============================================================ -->
    <section class="screen" id="screen-yes">

          <div class="pixel-stage party"><div class="pixel-art dancing delay1" id="charYes2"></div></div>

          <div class="pixel-stage party"><div class="pixel-art crying delay1" id="charNo2"></div></div>
          <div class="pixel-stage party"><div class="pixel-art crying delay2" id="charNo3"></div></div>
        </div>
        <div class="tears big-tears" id="tearsNo"></div>
        <p class="msg small-text">it's ok... thanks for being honest</p>
        <button class="btn btn-ghost" id="btnResetNo">↺ restart</button>

<script>
/* =================================================================
   BAGIAN 1: DATA PIXEL ART (8-BIT)
   -----------------------------------------------------------------
   Setiap karakter digambar sebagai grid 14x14 menggunakan kode
   karakter yang dipetakan ke warna lewat PALETTE.
   '.' = transparan (tidak digambar)
   Karakter lain mengikuti PALETTE di bawah.

   CATATAN UNTUK KAMU:
   Kalau mau pakai GIF Hello Kitty / Sanrio asli (misalnya dari
   Giphy atau koleksi pixel art kamu sendiri), tinggal ganti elemen
   <div class="pixel-art" id="..."></div> di HTML dengan:
       <img class="pixel-art" src="URL_GIF_KAMU" style="width:84px;height:84px;">
   lalu hapus pemanggilan renderPixelArt() untuk elemen tersebut.
   ================================================================= */

const PALETTE = {
  w: '#ffffff', // putih (badan)
  p: '#ffb3c6', // pink pastel (hood / pita / pipi)
  r: '#ff4d6d', // merah (pita / aksen)
  b: '#3a3a3a', // gelap (mata / alis)
  v: '#c9a0ff'  // ungu pastel (aksen Kuromi)
};

// ---- KITTY ----
const KITTY_BASE = [
  "..ww......ww..",
  "rrwww....wwww.",
  "rrwwww..wwwwww",
  "wwwwwwwwwwwwww",
  "wwwwwwwwwwwwww",
  "wwwwwwwwwwwwww",
  "wwwwbwwwwbwwww",
  "wwwwbwwwwbwwww",
  "wwwwwwwwwwwwww",
  "wwwwwwwwwwwwww",
  ".wwwwwwwwwwww.",
  "..wwwwwwwwww..",
  "...wwwwwwww...",
  "....wwwwww...."
];
const KITTY_BLUSH = KITTY_BASE.map((row,i) =>
  (i===8 || i===9) ? "wwppwwwwwwppww" : row
);
const KITTY_SAD = KITTY_BASE.map((row,i) =>
  i===5 ? "wwwbbwwwwbbwww" : row
);

// ---- MELODY ----
const MELODY_BASE = [
  ".pp......pp...",
  ".pp......pp...",
  "pppppprrpppppp",
  "pwwwwwwwwwwwwp",
  "pwwwwwwwwwwwwp",
  "pwwbwwwwbwwwwp",
  "pwwbwwwwbwwwwp",
  "pwwwwwwwwwwwwp",
  "pwwwwwwwwwwwwp",
  "pwwwwwwwwwwwwp",
  "pwwwwwwwwwwwwp",
  ".pppppppppppp.",
  "..pppppppppp..",
  "...pppppppp..."
];
const MELODY_SAD = MELODY_BASE.map((row,i) =>
  i===4 ? "pwwbbwwwwbbwwp" : row
);

// ---- KUROMI ----
const KUROMI_BASE = [
  "..bb......bb..",
  "vvbbb....bbbb.",
  "vvbbbb..bbbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbrbbbbrbbbb",
  "bbbbrbbbbrbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  ".bbbbbbbbbbbb.",
  "..bbbbbbbbbb..",
  "...bbbbbbbb...",
  "....bbbbbb...."
];
const KUROMI_SAD = KUROMI_BASE.map((row,i) =>
  i===5 ? "bbbvvbbbbvvbbb" : row
);

// ---- HATI KECIL (dekorasi & konfeti) ----
const HEART_RED = [
  ".rr.rr.",
  "rrrrrrr",
  "rrrrrrr",
  ".rrrrr.",
  "..rrr..",
  "...r..."
];
const HEART_PINK = HEART_RED.map(r => r.replace(/r/g,'p'));

/* =================================================================
   BAGIAN 2: RENDERER PIXEL ART (box-shadow trick)
   ================================================================= */
function renderPixelArt(el, grid, size = 6) {
  const shadows = [];
  for (let y = 0; y < grid.length; y++) {
    const row = grid[y];
    for (let x = 0; x < row.length; x++) {
      const color = PALETTE[row[x]];
      if (color) shadows.push(`${x*size}px ${y*size}px 0 0 ${color}`);
    }
  }
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.background = 'transparent';
  el.style.boxShadow = shadows.join(',');
}

/* =================================================================
   BAGIAN 3: AUDIO 8-BIT (Web Audio API)
   ================================================================= */
let audioCtx = null;
let muted = false;
let bgMusicTimer = null;
let bgIndex = 0;
const BG_MELODY = [659,659,784,659,523,523,659,784,880,784,659,523,440,523,659,523];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Mainkan satu nada pendek bergaya chiptune
function playTone(freq, duration = 0.12, type = 'square', vol = 0.05, when = 0) {
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = vol;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.start(t);
  osc.stop(t + duration);
}

function startBgMusic() {
  if (bgMusicTimer) return;
  bgMusicTimer = setInterval(() => {
    playTone(BG_MELODY[bgIndex % BG_MELODY.length], 0.18, 'square', 0.025);
    bgIndex++;
  }, 230);
}

function playClick()   { playTone(880, 0.08, 'square', 0.05); }
function playTypeBlip(){ playTone(320 + Math.random()*120, 0.03, 'square', 0.02); }
function playSadTone() {
  [440,392,349,294].forEach((f,i) => playTone(f, 0.35, 'triangle', 0.05, i*0.18));
}
function playSuccessJingle() {
  [523,659,784,1046].forEach((f,i) => playTone(f, 0.18, 'square', 0.06, i*0.12));
}

/* =================================================================
   BAGIAN 4: SISTEM PENCATATAN JAWABAN (DATA RECORDING)
   -----------------------------------------------------------------
   Setiap jawaban (mood 1-10, dan IYA/TIDAK) akan dikirim ke fungsi
   recordAnswer(). Pilih SALAH SATU metode di bawah dan isi
   konfigurasinya. Secara default kode ini hanya mencatat ke
   console.log() (aman, tidak mengirim apa pun ke luar).

   ===== OPSI A: GOOGLE SHEETS via Google Apps Script (PALING MUDAH) =====
   1. Buat Google Sheet baru.
   2. Buka menu Extensions > Apps Script.
   3. Hapus semua kode default, ganti dengan script di paling bawah
      file ini (cari komentar "CONTOH GOOGLE APPS SCRIPT").
   4. Klik Deploy > New deployment > pilih "Web app".
      - Execute as : Me
      - Who has access : Anyone
   5. Copy URL yang berakhiran ".../exec" lalu tempel di
      GOOGLE_SCRIPT_URL di bawah ini.

   ===== OPSI B: FORMSPREE (alternatif tanpa Apps Script) =====
   1. Daftar gratis di https://formspree.io dan buat form baru.
   2. Copy endpoint-nya (contoh: https://formspree.io/f/abcd1234).
   3. Isi FORMSPREE_URL di bawah, lalu set ACTIVE_METHOD = 'formspree'.
   ================================================================= */

// >>> GANTI dengan URL Web App Google Apps Script kamu (".../exec") <<<
const GOOGLE_SCRIPT_URL = "PASTE_URL_GOOGLE_APPS_SCRIPT_DISINI";

// >>> Atau, GANTI dengan endpoint Formspree kamu <<<
const FORMSPREE_URL = "PASTE_URL_FORMSPREE_DISINI";

// Pilih metode aktif: 'none' | 'google' | 'formspree'
const ACTIVE_METHOD = 'none';

// Menyimpan semua jawaban di memori (bisa dicek lewat console: window.answersLog)
window.answersLog = [];

function recordAnswer(type, value) {
  const payload = {
    type: type,                    // 'mood' atau 'confession'
    value: value,                  // angka 1-10, atau 'IYA' / 'TIDAK'
    timestamp: new Date().toISOString(),
    userAgent: navigator.userAgent
  };
  window.answersLog.push(payload);
  console.log('📝 Jawaban tercatat:', payload);

  if (ACTIVE_METHOD === 'google' && !GOOGLE_SCRIPT_URL.includes('PASTE_URL')) {
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // wajib 'no-cors': Apps Script tidak mengembalikan header CORS
      headers: { 'Content-Type': 'text/plain' }, // text/plain agar tidak memicu preflight
      body: JSON.stringify(payload)
    }).catch(err => console.warn('Gagal mengirim ke Google Sheets:', err));
  }

  if (ACTIVE_METHOD === 'formspree' && !FORMSPREE_URL.includes('PASTE_URL')) {
    fetch(FORMSPREE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(err => console.warn('Gagal mengirim ke Formspree:', err));
  }
}

/* =================================================================
   BAGIAN 5: NAVIGASI ANTAR HALAMAN
   ================================================================= */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* =================================================================
   BAGIAN 6: EFEK VISUAL (tears, confetti, bg hearts)
   ================================================================= */
function spawnTears(containerId, count = 5) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const tear = document.createElement('div');
    tear.className = 'tear-pixel';
    tear.style.left = (12 + Math.random() * 64) + '%';
    tear.style.animationDelay = (Math.random() * 1.2) + 's';
    tear.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
    container.appendChild(tear);
  }
}

function spawnConfetti(count = 50) {
  const layer = document.getElementById('confettiLayer');
  layer.innerHTML = '';
  const colors = ['#ff4d6d', '#ffb3c6', '#ffffff', '#fff6b7', '#c9a0ff'];
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 2) + 's';
    piece.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    layer.appendChild(piece);
  }
}

function spawnBgHearts(count = 9) {
  const layer = document.getElementById('bgDecor');
  for (let i = 0; i < count; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'bg-heart';
    wrap.style.left = (Math.random() * 95) + '%';
    wrap.style.animationDuration = (12 + Math.random() * 12) + 's';
    wrap.style.animationDelay = (-(Math.random() * 22)) + 's';

    const art = document.createElement('div');
    art.className = 'pixel-art';
    wrap.appendChild(art);
    layer.appendChild(wrap);

    renderPixelArt(art, Math.random() > 0.5 ? HEART_RED : HEART_PINK, 4);
  }
}

/* =================================================================
   BAGIAN 7: LOGIKA MOOD FACE
   ================================================================= */
function updateMoodFace(val) {
  const el = document.getElementById('moodFace');
  if (val < 5)      renderPixelArt(el, KITTY_SAD);
  else if (val < 8) renderPixelArt(el, KITTY_BASE);
  else              renderPixelArt(el, KITTY_BLUSH);
}

/* =================================================================
   BAGIAN 8: EFEK TYPING (PERTANYAAN 2)
   ================================================================= */
const CONFESSION_TEXT =
  "So, this might ruin our friendship... but I think u r kind of perfect for me. I love you <3";

function startTyping() {
  const el = document.getElementById('typingText');
  el.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    el.textContent += CONFESSION_TEXT[i];
    if (i % 2 === 0) playTypeBlip();
    i++;
    if (i >= CONFESSION_TEXT.length) {
      clearInterval(interval);
      document.getElementById('confessionButtons').classList.remove('hidden');
    }
  }, 45);
}

/* =================================================================
   BAGIAN 9: RENDER KARAKTER PESTA (ENDING)
   ================================================================= */
function renderPartyCharacters(happy) {
  const prefix = happy ? 'charYes' : 'charNo';
  const sets = happy
    ? [KITTY_BASE, MELODY_BASE, KUROMI_BASE]
    : [KITTY_SAD, MELODY_SAD, KUROMI_SAD];
  for (let i = 0; i < 3; i++) {
    renderPixelArt(document.getElementById(prefix + (i + 1)), sets[i], 5);
  }
}

/* =================================================================
   BAGIAN 10: EVENT LISTENERS / ALUR APLIKASI
   ================================================================= */
window.addEventListener('DOMContentLoaded', () => {
  // render karakter awal
  renderPixelArt(document.getElementById('kittyLanding'), KITTY_BASE);
  renderPixelArt(document.getElementById('moodFace'), KITTY_BASE);
  spawnBgHearts();

  // --- Toggle suara ---
  const btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', () => {
    initAudio();
    muted = !muted;
    btnSound.textContent = muted ? '🔇' : '🔈';
  });

  // --- HALAMAN 1 -> 2 ---
  document.getElementById('btnStart').addEventListener('click', () => {
    initAudio();
    startBgMusic();
    playClick();
    showScreen('screen-mood');
  });

  // --- Slider mood ---
  const moodSlider = document.getElementById('moodSlider');
  const moodValue = document.getElementById('moodValue');
  moodSlider.addEventListener('input', () => {
    const val = parseInt(moodSlider.value, 10);
    moodValue.textContent = val;
    updateMoodFace(val);
    playTone(380 + val * 30, 0.05, 'square', 0.025);
  });

  // --- HALAMAN 2 -> 2B atau 3 ---
  document.getElementById('btnMoodNext').addEventListener('click', () => {
    const val = parseInt(moodSlider.value, 10);
    playClick();

    // 🔴 CATAT JAWABAN MOOD (1-10) DI SINI
    recordAnswer('mood', val);

    if (val < 5) {
      renderPixelArt(document.getElementById('kittySadMood'), KITTY_SAD);
      spawnTears('tearsSadMood');
      playSadTone();
      showScreen('screen-sadmood');
    } else {
      renderPixelArt(document.getElementById('kittyConfess'), KITTY_BLUSH);
      showScreen('screen-confession');
      startTyping();
    }
  });

  // --- Reset (mood rendah) ---
  document.getElementById('btnResetSadMood').addEventListener('click', () => {
    location.reload();
  });

  // --- HALAMAN 3 -> 4A / 4B ---
  document.getElementById('btnYes').addEventListener('click', () => {
    playClick();

    // 🔴 CATAT JAWABAN CONFESSION = IYA DI SINI
    recordAnswer('confession', 'IYA');

    renderPartyCharacters(true);
    showScreen('screen-yes');
    spawnConfetti();
    playSuccessJingle();
  });

  document.getElementById('btnNo').addEventListener('click', () => {
    playClick();

    // 🔴 CATAT JAWABAN CONFESSION = TIDAK DI SINI
    recordAnswer('confession', 'TIDAK');

    renderPartyCharacters(false);
    showScreen('screen-no');
    spawnTears('tearsNo', 8);
    playSadTone();
  });

  // --- Reset (hasil akhir) ---
  document.getElementById('btnResetYes').addEventListener('click', () => location.reload());
  document.getElementById('btnResetNo').addEventListener('click', () => location.reload());
});
</script>

<!-- =================================================================
     CONTOH GOOGLE APPS SCRIPT (untuk OPSI A di atas)
     -----------------------------------------------------------------
     Cara pakai:
     1. Buka Google Sheet baru -> menu Extensions > Apps Script.
     2. Hapus isi default, copy-paste kode JS di bawah ini ke editor
        Apps Script (HAPUS tag <script> komentar ini, kode di bawah
        murni untuk Apps Script, bukan untuk file HTML ini).
     3. Klik Deploy > New deployment > Web app
        - Execute as : Me
        - Who has access : Anyone
     4. Copy URL ".../exec" ke variabel GOOGLE_SCRIPT_URL di atas,
        lalu ubah ACTIVE_METHOD jadi 'google'.

function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Jawaban')
            || SpreadsheetApp.getActiveSpreadsheet().insertSheet('Jawaban');

  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['Timestamp', 'Tipe', 'Jawaban', 'User Agent']);
  }

  var data = JSON.parse(e.postData.contents);
  sheet.appendRow([
    new Date(),
    data.type,
    data.value,
    data.userAgent || ''
  ]);

  return ContentService
    .createTextOutput(JSON.stringify({ status: 'ok' }))
    .setMimeType(ContentService.MimeType.JSON);
}
